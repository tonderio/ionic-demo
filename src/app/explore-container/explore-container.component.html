<div id="container">
  <app-demo-config
    [config]="config"
    [showPaymentFields]="true"
    [showRefresh]="true"
    (refresh)="ngOnInit()">
  </app-demo-config>

  <form id="payment-form">
    <div id="tonder-checkout"></div>
  </form>
  @if (externalButton) {
    <button class="external-payment-button" (click)="onPayment($event)">Pay</button>
  }
  <div id="container-external-selector" class="empty-div">
    <label for="external-selector">External button: </label>
    <input id="external-selector" (change)="onExternalSelectorClick($event)" type="checkbox">
  </div>
  @if (showLayer) {
    <div (click)="onLayerClick($event)" class="no-redirect-on-complete">Este layout se muestra al ejecutar el callback de éxito</div>
  }
</div>
