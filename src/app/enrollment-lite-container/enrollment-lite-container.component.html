<div id="container">

  <!-- Demo configuration — collapsed by default, does not affect SDK logic -->
  <app-demo-config [config]="config"  [showPaymentFields]="true" [showRefresh]="true" (refresh)="ngOnInit()"></app-demo-config>

  <div class="lite-container-tonder">

    <!-- Card preview: live while typing, Reveal Elements after save -->
    <app-card-preview
      [cardPreview]="cardPreview"
      [cardFieldState]="cardFieldState"
      [cardSaved]="cardSaved">
    </app-card-preview>

    <!-- ── Skyflow Collect Fields ── -->
    <ng-container *ngIf="!cardSaved">
      <div style="max-height: 70px; overflow: hidden">
        <div id="collect_enroll_cardholder_name"></div>
      </div>
      <div style="max-height: 80px; overflow: hidden">
        <div id="collect_enroll_card_number"></div>
      </div>
      <div class="collect-row">
        <div style="max-height: 90px; overflow: hidden">
          <div id="collect_enroll_expiration_month"></div>
        </div>
        <div style="max-height: 90px; overflow: hidden">
          <div id="collect_enroll_expiration_year"></div>
        </div>
        <div style="max-height: 90px; overflow: hidden">
          <div id="collect_enroll_cvv"></div>
        </div>
      </div>
      <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
      <button class="btn-primary" (click)="onSave()" [disabled]="isSaving">
        <span *ngIf="isSaving" class="btn-spinner"></span>
        {{ isSaving ? 'Guardando...' : 'Guardar tarjeta' }}
      </button>
    </ng-container>

    <button *ngIf="cardSaved" class="btn-secondary" (click)="reset()">Regresar</button>

  </div>

</div>
